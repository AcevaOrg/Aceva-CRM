<!doctype html>
<html><head><meta charset="utf-8"><title>QA phone frame</title>
<style>html,body{margin:0;background:#888}iframe{display:block;border:0;background:#fff}</style></head>
<body>
<!-- TEMPORARY QA HARNESS: renders a page at phone width. Delete public/__qa before shipping. -->
<script>
  const p = new URLSearchParams(location.search);
  const f = document.createElement("iframe");
  f.width = p.get("w") || "360"; f.height = p.get("h") || "780";
  f.src = p.get("src") || "/";
  document.body.appendChild(f);
</script>
</body></html>
