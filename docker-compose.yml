# Local development services for Aceva: PostgreSQL 17, Redis 7, Mailpit, and (on request) ClamAV. DEVELOPMENT ONLY.
#
#   Start:            docker compose up -d
#   Stop:             docker compose down
#   Stop and wipe:    docker compose down -v     (deletes the databases and the Redis data)
#
# Every port listens on this computer only (127.0.0.1), never on the network.
# The passwords below are obvious local placeholders. They match backend/.env.example; never use them anywhere else.
name: aceva

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aceva_app
      POSTGRES_PASSWORD: local-only-db-password
      POSTGRES_DB: aceva_dev # aceva_test and aceva_shadow are created by docker/postgres/init
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aceva_app -d aceva_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "local-only-redis-password", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-only-redis-password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Catches every email the app sends (welcome emails, password resets). Read them at http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025" # SMTP (the backend sends here)
      - "127.0.0.1:8025:8025" # web inbox
    restart: unless-stopped

  # Module 14 file scanning (ClamAV daemon). About 1 GB of memory, so it starts only when asked for:
  #   docker compose --profile scanner up -d clamav
  # The backend (run with npm, outside Compose) reaches it at 127.0.0.1:3310 (CLAMD_HOST / CLAMD_PORT). It needs no
  # start order: until clamd answers, uploads stay "scanning" (unopenable) and are checked again (fail closed).
  # Image: the official Cisco Talos image, pinned to the version the scanner integration was tested with (1.5.5).
  # Healthcheck: the image's own clamdcheck.sh (PING to clamd on 3310 must answer PONG). The first start downloads the
  # signatures, so it is given the image's own 6-minute start period. Signatures are kept in the clamav-data volume.
  clamav:
    image: clamav/clamav:1.5.5
    profiles: ["scanner"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 6m
    restart: unless-stopped

volumes:
  clamav-data:
  postgres-data:
  redis-data:
